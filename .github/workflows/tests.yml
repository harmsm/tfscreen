name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: Include slow tests (--runslow)
        type: boolean
        default: false

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        # The coverage job runs this one, plus the slow tests.
        exclude:
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Lint (fatal errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        env:
          NUMBA_DISABLE_JIT: "1"
        run: >
          pytest -n auto tests/tfscreen
          ${{ (github.event_name == 'workflow_dispatch' && inputs.run_slow_tests) && '--runslow' || '' }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover compares against main, so it needs the full history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      # Slow tests are included so code tested only by them counts as covered.
      # pytest-cov combines the workers' data; settings come from pyproject.toml
      # (branch coverage, source = tfscreen only, so planning/, tests/ and
      # docs/ are never measured).
      - name: Run unit tests under coverage
        env:
          NUMBA_DISABLE_JIT: "1"
        run: pytest -n auto --runslow --cov --cov-report= tests/tfscreen

      - name: Report total coverage
        run: |
          coverage xml
          coverage report --fail-under=90

      # Every line and branch a pull request adds or changes in src/ must be
      # covered. Files outside coverage.xml are not judged.
      - name: Check coverage of changed lines
        if: github.event_name == 'pull_request'
        run: >
          diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --fail-under=100
