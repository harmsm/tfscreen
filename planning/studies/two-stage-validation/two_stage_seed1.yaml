# tfs-fit-two-stage validation, seed1 (planning/studies/two-stage-validation).
# Full-size simulation, seed 1 (sim_realistic_s2: the simulator's second calibration). Its own simulate config is the library config, as in the m-bias study (wt mostly spiked, as simulated); lambda prior around the simulated 0.357.
# Cluster paths: run from the cluster with submit.sh.

growth_df: /gpfs/projects/harmslab/harms/studies/full-sized-sims-3/sim_realistic_s2/tfs_growth.csv
library_config: /gpfs/projects/harmslab/harms/studies/full-sized-sims-3/sim_realistic_s2/simulate_config.yaml
theta_model: hill_relative
growth_shares_replicates: true
batch_size: 4096
allow_missing_spikes: true
growth_priors: /gpfs/projects/harmslab/harms/studies/full-sized-sims-3/growth_priors_loose.csv
set_priors: [sigma_fixed=0.17, theta_log_hill_n_hyper_scale_fixed=0.5]
skip_model_stats: true

two_stage:
  transformation_lambda: [0.357, 0.15]
  seed: 1
  jackknife_subsamples: 30
  jackknife_drop_frac: 0.2
  num_posterior_samples: 500
  consistency: true
  consistency_library: kanR
  predict_epistasis: false
