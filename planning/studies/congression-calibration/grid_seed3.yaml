# ---------------------------------------------------------------------------
# Third seed for grid_baseline.yaml (congression calibration, step 3.5)
#
#   tfs-setup-sim-grid grid_seed3.yaml --out_prefix congression_calibration_seed3
#   for d in congression_calibration_seed3/run_*/; do (cd "$d" && sbatch run.srun); done
#
# Lambda 0 and 1.0 x {single, mixture}, seed 3; otherwise identical to
# grid_baseline.yaml. 4 runs.
# ---------------------------------------------------------------------------

base_config: simulate_config.yaml

run_name: "lam{{ transformation_poisson_lambda }}__seed{{ seed }}__{{ fit }}_{{ lam_prior }}"

output_file: run.srun


simulate:

  - name: lam
    variants:
      - transformation_poisson_lambda: 0.0
      - transformation_poisson_lambda: 1.0

  - name: dk
    variants:
      - dk_geno_hyper_loc: -3.5
        dk_geno_hyper_scale: 0.5
        dk_geno_hyper_shift: 0.02

  - name: seed
    variants:
      - seed: 3


template:

  - name: fit
    variants:
      - fit: single
        lam_prior: "off"
      - fit: mixture
        lam_prior: matched

  - name: anchor
    variants:
      - binding_weight: 1.0
        k_scale_ceiling: 0.005
